[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikidata-collector"
version = "0.1.0"
description = "Python library for fetching and normalizing public entities from Wikidata via SPARQL"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Jonathan Klüser", email = "jonathan.klueser@live.de"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.12.3",
    "python-dotenv>=1.1.1",
    "random-user-agent>=1.0.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-randomly>=3.15.0",
    "responses>=0.25.0",
    "ruff>=0.14.9",
    "pyright>=1.1.390",
]

[tool.pyright]
include = ["wikidata_collector", "tests"]
exclude = ["**/__pycache__", ".venv", "venv", "htmlcov"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.setuptools.packages.find]
where = ["."]
include = ["wikidata_collector*"]
exclude = ["tests*", "specs*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: full pipeline over mocked HTTP (deselect with -m 'not integration')",
    "iterator: iterator-based public API (select with -m iterator)",
    "live: hits the real Wikidata SPARQL endpoint (deselect with -m 'not live')",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--tb=short",
    "-ra",
    # Live tests hit the real Wikidata endpoint and are therefore opt-in.
    # A `-m` on the command line replaces this one, so `pytest -m live` works.
    "-m",
    "not live",
]
# Warnings are failures: a DeprecationWarning from a dependency is a migration we
# have not done yet, not background noise. Add a narrow ignore with a reason if a
# warning is genuinely outside our control.
filterwarnings = ["error"]
log_cli_level = "WARNING"

[tool.coverage.run]
source = ["wikidata_collector"]
branch = true
parallel = true

[tool.coverage.paths]
source = ["wikidata_collector", "*/wikidata_collector"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Raise this floor as coverage improves; never lower it to make a build pass.
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.$",
]
